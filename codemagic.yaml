workflows:
  ios-workflow:
    name: Build iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm ci || npm install
      - name: Build web assets
        script: |
          npm run build || echo "No build script found, continuing..."
      - name: Sync Capacitor
        script: |
          npx --yes @capacitor/cli sync ios
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App" || \
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - **/*.ipa